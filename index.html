/* Облик по референсу: фотографичный тёмно-шалфейный фон с расфокусным цветком,
   стеклянные карточки, кремовые пилюли, зерно плёнки. Осознанно одна тема. */
:root{
  --bg:#1b1f19;
  --glass:rgba(255,255,255,.055);
  --glass2:rgba(255,255,255,.10);
  --stroke:rgba(255,255,255,.13);
  --stroke-top:rgba(255,255,255,.22);
  --ink:#edebe0;
  --muted:#aab0a0;
  --cream:#e6e1c6;
  --cream-ink:#262a20;
  --gold:#d2ab52;
  --warn:#e08a74;
  --display:"Onest","Golos Text",-apple-system,"Segoe UI",sans-serif;
  --body:"Golos Text",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html{height:100%; -webkit-text-size-adjust:100%; overscroll-behavior:none;}
body{
  margin:0;
  overscroll-behavior:none; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none;
  background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}

}
.wrap{max-width:480px; margin:0 auto; padding-block:30px 72px; display:flex; flex-direction:column; gap:20px;}

/* ---------- шапка ---------- */
header{position:relative; padding-block:6px 4px; min-height:196px;}
.toprow{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.logo{color:var(--cream); opacity:.95;}
.logo svg{width:32px; height:22px; display:block;}
.date{font-size:.76rem; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; margin:0 0 10px; text-shadow:0 1px 8px rgba(0,0,0,.4);}
header h1{font-family:var(--display); font-weight:300; font-size:2.35rem; line-height:1.12; margin:0; text-wrap:balance; max-width:8.5em; letter-spacing:-.01em; text-shadow:0 2px 14px rgba(0,0,0,.35);}
.tagline{color:var(--muted); font-size:.93rem; margin:12px 0 0; max-width:15em; text-shadow:0 1px 8px rgba(0,0,0,.4);}
.streak{display:inline-block; margin-top:12px; font-size:.8rem; color:var(--gold); font-weight:600; letter-spacing:.03em;}

/* ---------- вкладки ---------- */
.tabs{display:flex; border:1px solid var(--stroke); border-radius:999px; width:fit-content; background:rgba(20,24,17,.4); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); padding:3px;}
.tabs button{font:inherit; font-size:.9rem; font-weight:500; border:none; background:transparent; color:var(--ink); padding:8px 22px; cursor:pointer; border-radius:999px;}
.tabs button[aria-selected="true"]{background:var(--cream); color:var(--cream-ink); font-weight:600;}

/* ---------- стеклянные карточки ---------- */
.card{
  background:var(--glass);
  border:1px solid var(--stroke); border-top-color:var(--stroke-top);
  border-radius:24px; padding:20px;
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  box-shadow:0 18px 40px rgba(0,0,0,.28);
}
.label{display:flex; align-items:center; gap:7px; font-size:.74rem; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600;}
.label .star{color:var(--gold); font-size:.85rem;}
.label .arr{margin-left:auto; color:var(--muted); font-size:1rem;}
.hero h3{font-family:var(--display); font-weight:400; font-size:1.55rem; letter-spacing:-.01em; margin:12px 0 2px;}
.hero .pmeta{margin:0 0 6px;}
.hero .pdesc{margin:0 0 16px; color:var(--muted);}

/* ---------- кнопки ---------- */
.btn{
  display:inline-flex; align-items:center; gap:9px;
  font:inherit; font-weight:600; font-size:.92rem;
  background:var(--cream); color:var(--cream-ink);
  border:none; border-radius:999px; padding:11px 24px; cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}
.btn .tri{width:0;height:0;border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent currentColor;}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--stroke); font-weight:500; box-shadow:none;}
.btn[disabled]{opacity:.5; cursor:default;}
button:focus-visible, textarea:focus-visible, input:focus-visible{outline:2px solid var(--cream); outline-offset:2px;}

/* ---------- сетка практик ---------- */
.sect-label{font-size:.74rem; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:26px 0 12px;}
.sect-label:first-child{margin-top:0;}
.cats{display:grid; grid-template-columns:repeat(4,1fr); gap:16px 6px;}
.cat{display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:none; padding:0; cursor:pointer; font:inherit; color:var(--muted); font-size:.7rem; line-height:1.25; text-align:center;}
.cat .ic{
  width:58px; height:58px; border-radius:19px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
  border:1px solid var(--stroke); border-top-color:var(--stroke-top); color:#ddd9c2;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.cat:hover .ic{background:var(--glass2);}
.cat svg{width:25px; height:25px;}

/* ---------- поля ---------- */
.chips{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.gfilter{margin-bottom:16px;}
.chip{font:inherit; font-size:.84rem; font-weight:500; color:var(--ink); background:rgba(20,24,17,.35); border:1px solid var(--stroke); border-radius:999px; padding:6px 14px; cursor:pointer; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
.chip[aria-pressed="true"]{background:var(--cream); color:var(--cream-ink); border-color:var(--cream);}
textarea, input[type="text"]{
  width:100%; box-sizing:border-box; font:inherit; font-size:16px; color:var(--ink);
  background:rgba(0,0,0,.3); border:1px solid var(--stroke); border-radius:15px; padding:12px 14px;
  -webkit-user-select:text; user-select:text;
}
.entry-text{-webkit-user-select:text; user-select:text;}
textarea{min-height:90px; resize:vertical;}
textarea.big{min-height:180px;}
textarea::placeholder, input::placeholder{color:#7d8273;}
label.fld{display:block; font-size:.82rem; font-weight:600; color:var(--muted); margin:15px 0 7px; letter-spacing:.02em;}
label.fld:first-child{margin-top:0;}
.fld-note{font-weight:400; display:block; margin-top:2px;}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-top:15px;}
.notice{font-size:.85rem; color:var(--muted); margin-top:10px;}
.notice.err{color:var(--warn);}
.notice.ok{color:var(--cream); font-weight:500;}

/* ---------- библиотека ---------- */
.plist{display:flex; flex-direction:column; gap:12px;}
.pcard h3{font-family:var(--display); font-weight:400; font-size:1.22rem; margin:0;}
.pmeta{font-size:.8rem; color:var(--muted); margin:4px 0 8px;}
.pdesc{font-size:.92rem; margin:0 0 10px;}
details.why{font-size:.88rem; color:var(--muted); margin-bottom:12px;}
details.why summary{cursor:pointer; color:var(--cream); font-weight:500;}
details.why p{margin:8px 0 0;}

/* ---------- тренажёр ---------- */
.runner-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.runner-top h3{font-family:var(--display); font-weight:400; font-size:1.4rem; margin:0;}
.stepnum{font-size:.8rem; color:var(--muted);}
.instr{background:rgba(230,225,198,.09); border:1px solid rgba(230,225,198,.16); border-radius:15px; padding:12px 14px; font-size:.92rem; margin:13px 0;}
.slider-row{display:flex; align-items:center; gap:12px; margin-top:4px;}
.slider-row input[type="range"]{flex:1; min-width:0; accent-color:var(--cream);}
.slider-val{font-variant-numeric:tabular-nums; font-weight:600; min-width:2ch; text-align:right;}
.checks{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
.checks label{display:flex; gap:9px; align-items:flex-start; font-size:.92rem; cursor:pointer;}
.checks input{accent-color:var(--cream); margin-top:3px;}
.checks small{color:var(--muted);}

/* ---------- таймеры ---------- */
.timerbox{display:flex; flex-direction:column; align-items:center; gap:14px; padding:18px 0 8px;}
.bigtime{font-variant-numeric:tabular-nums; font-family:var(--display); font-weight:300; font-size:2.8rem;}
.phase{font-size:1.05rem; font-weight:600; color:var(--cream); min-height:1.4em;}
.circle{width:124px; height:124px; border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(230,225,198,.28), rgba(230,225,198,.07) 70%); border:1.5px solid var(--cream); transform:scale(.7);}
@media (prefers-reduced-motion: no-preference){ .circle{transition:transform linear;} }
@media (prefers-reduced-motion: reduce){ .circle{display:none;} }
.cycles{font-size:.85rem; color:var(--muted);}

/* ---------- лента ---------- */
.daygroup h2{font-family:var(--display); font-weight:400; font-size:1rem; color:var(--muted); margin:18px 0 10px;}
.entries{display:flex; flex-direction:column; gap:10px;}
.entry{display:flex; gap:12px; background:var(--glass); border:1px solid var(--stroke); border-top-color:var(--stroke-top); border-radius:19px; padding:14px 16px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);}
.eicon{flex:none; width:42px; height:42px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:#ddd9c2; background:linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); border:1px solid var(--stroke);}
.eicon svg{width:20px; height:20px;}
.ebody{flex:1; min-width:0;}
.entry-top{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:baseline; font-size:.76rem; color:var(--muted); margin-bottom:6px;}
.tag{color:var(--cream); font-weight:600; letter-spacing:.06em; text-transform:uppercase;}
.entry-text{white-space:pre-wrap; overflow-wrap:break-word; min-width:0; font-size:.95rem;}
.del{font:inherit; font-size:.75rem; color:var(--muted); background:none; border:none; cursor:pointer; margin-left:auto; padding:2px 4px; border-radius:6px;}
.del.arm{color:var(--warn); font-weight:600;}
.empty{border-style:dashed; color:var(--muted); font-size:.95rem;}
.empty b{color:var(--ink);}
[hidden]{display:none!important;}
</style>
</head>

</div>

/* ---------- сохранение ---------- */
function notice(node,msg,cls){
  node.hidden=!msg; node.textContent=msg||"";
  node.classList.remove("err","ok"); if(cls) node.classList.add(cls);
}
function saveEntry(doc, done, fail){
  if(!state.db){ fail("Записи не сохраняются: открой страницу, войдя в claude.ai."); return; }
  var now=new Date();
  doc.ts=now.toISOString(); doc.day=localDay(now);
  var id="e"+now.getTime()+Math.floor(Math.random()*1000);
  state.db.collection("entries").doc(id).set(doc).then(done).catch(function(err){
    fail("Не сохранилось ("+(err&&err.code?err.code:"ошибка")+"). Попробуй ещё раз.");
  });
}
el.save_btn.addEventListener("click",function(){
  var text=el.entry_text.value.trim();
  if(!text){ el.entry_text.focus(); return; }
  el.save_btn.disabled=true;
  saveEntry({type:"free", text:text, mood:state.mood}, function(){
    el.entry_text.value=""; try{localStorage.removeItem("draft");}catch(e){}
    state.mood=null;
    Array.prototype.forEach.call(el.mood_chips.children,function(c){c.setAttribute("aria-pressed","false");});
    notice(el.db_notice,"Записано.","ok"); el.save_btn.disabled=false;
    setTimeout(function(){ if(el.db_notice.textContent==="Записано.") notice(el.db_notice,""); },2500);
  },function(msg){ notice(el.db_notice,msg,"err"); el.save_btn.disabled=false; });
});

function multiChips(key, list, max){

/* ---------- таймеры ---------- */
var timer={int:null};
function stopTimer(){ if(timer.int){ clearInterval(timer.int); timer.int=null; } }
function bell(){
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.value=528; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+2.2);
    o.start(); o.stop(ctx.currentTime+2.3);
  }catch(e){}
}
function mmss(s){ var m=Math.floor(s/60), ss=s%60; return m+":"+("0"+ss).slice(-2); }

var GROW={"Вдох":1,"Довдох":1,"Напряги":1}, SHRINK={"Выдох":1,"Отпусти":1};
function phaseBox(container, getPhases, cycLabel, cycKey){
  var box=document.createElement("div"); box.className="timerbox";
  var phase=document.createElement("div"); phase.className="phase"; phase.textContent="Готов(а)?";
  var circle=document.createElement("div"); circle.className="circle";
  var time=document.createElement("div"); time.className="bigtime"; time.textContent="—";
  var cyc=document.createElement("div"); cyc.className="cycles"; cyc.textContent=cycLabel+": "+(state.run.data[cycKey]||0);
  var start=document.createElement("button"); start.className="btn"; start.textContent="Старт";
  box.appendChild(phase); box.appendChild(circle); box.appendChild(time); box.appendChild(cyc); box.appendChild(start);
  container.appendChild(box);

  start.addEventListener("click",function(){
    if(timer.int){ stopTimer(); start.textContent="Старт"; phase.textContent="Пауза"; return; }
    start.textContent="Стоп";
    var phases=getPhases();
    var pi=0, left=phases[0].s;
    function applyPhase(){
      var ph=phases[pi];
      phase.textContent=ph.n; time.textContent=left;
      circle.style.transitionDuration=ph.s+"s";
      if(GROW[ph.n]) circle.style.transform="scale(1)";
      else if(SHRINK[ph.n]) circle.style.transform="scale(.7)";
    }
    applyPhase();
    timer.int=setInterval(function(){
      left--;
      if(left<=0){
        pi++;
        if(pi>=phases.length){ pi=0; state.run.data[cycKey]=(state.run.data[cycKey]||0)+1; cyc.textContent=cycLabel+": "+state.run.data[cycKey]; }
        left=phases[pi].s; applyPhase();
      } else { time.textContent=left; }
    },1000);
  });
}

function medBox(container){
  var box=document.createElement("div"); box.className="timerbox";
  var time=document.createElement("div"); time.className="bigtime";
  var left=(state.run.data.minutes||10)*60;
  if(state.run.data.secondsLeft!=null) left=state.run.data.secondsLeft;
  time.textContent=mmss(left);
  var start=document.createElement("button"); start.className="btn"; start.textContent="Старт";
  box.appendChild(time); box.appendChild(start); container.appendChild(box);
  start.addEventListener("click",function(){
    if(timer.int){ stopTimer(); start.textContent="Продолжить"; state.run.data.secondsLeft=left; return; }
    start.textContent="Пауза";
    timer.int=setInterval(function(){
      left--; state.run.data.secondsLeft=left; time.textContent=mmss(left);
      if(left<=0){ stopTimer(); bell(); time.textContent="0:00"; start.textContent="Готово"; state.run.data.done=true; }
    },1000);
  });
}
function minutesChips(c, options){

  c.appendChild(wrap);
}

function requiredField(id){

    case "woop": return ["plan","Допиши план «если…, то…» — без него WOOP не работает."];
    case "evening": return ["win1","Запиши хотя бы одно «получилось»."];
    case "selfcomp": return ["kind","Напиши слова поддержки себе — это суть практики."];
    case "gratitude": return ["g1","Запиши хотя бы одну благодарность."];
    case "money": return ["step","Запиши шаг этой недели — без него это просто мечта."];
    case "values": return ["action","Запиши конкретный поступок на завтра."];
    case "grounding": return ["g5","Начни с пяти вещей, которые видишь."];
    case "defusion": return ["thought","Запиши саму мысль."];
    case "worry": return ["worryList","Выгрузи список беспокойств."];
    case "writing": return ["text","Текст и есть практика — напиши хоть абзац."];

function composeText(id,dd){
  function line(label,v){ return v ? label+": "+v : null; }
  var parts=[];
  switch(id){
    case "morning":
      parts=[line("Фокус дня",dd.focus), line("Каким хочу быть",dd.identity), line("Визуализация",dd.vision)];
      break;
    case "cbt":
      parts=[line("Ситуация",dd.situation),
             line("Эмоция",dd.emotion?(dd.emotion+" ("+dd.intensityBefore+"/10)"):null),
             line("Мысль",dd.thought),
             line("Искажения",(dd.distortions&&dd.distortions.length)?dd.distortions.join(", "):null),
             line("За",dd.evFor), line("Против",dd.evAgainst),
             line("Новая формулировка",dd.reframe),
             line("Эмоция после",(dd.intensityAfter!=null)?(dd.intensityAfter+"/10"):null)];
      break;
    case "breath":
      var pat=BREATH_PATTERNS.filter(function(p){return p.id===dd.pattern;})[0];
      parts=[line("Ритм",pat?pat.label:dd.pattern), line("Циклов",dd.cycles?String(dd.cycles):null), line("Заметки",dd.note)];
      break;
    case "grounding":
      parts=[line("Вижу",dd.g5), line("Ощущаю",dd.g4), line("Слышу",dd.g3), line("Запахи",dd.g2), line("Вкус",dd.g1)];
      break;
    case "pmr":
      parts=[line("Групп пройдено",dd.cycles?String(dd.cycles):null), line("Зажато было",dd.note)];
      break;
    case "meditation":
      parts=[line("Длительность",dd.minutes+" мин"+(dd.done?"":" (не до конца)")), line("Заметил(а)",dd.note)];
      break;
    case "selfcomp":
      parts=[line("Что тяжело",dd.situation),
             line("Тяжесть",(dd.intensityBefore!=null)?(dd.intensityBefore+"/10"):null),
             line("Слова себе",dd.kind), line("Что мне нужно",dd.need)];
      break;
    case "defusion":
      parts=[line("Мысль",dd.thought), line("После дефьюжн",dd.shift)];
      break;
    case "worry":
      parts=[line("Беспокоит",dd.worryList), line("Окно тревоги",dd.windowTime),
             line("Решаемо — шаг",dd.solvable), line("Не контролирую",dd.unsolvable)];
      break;
    case "gratitude":
      var gs=[dd.g1,dd.g2,dd.g3].filter(Boolean);
      parts=[gs.length?("Благодарен(на):\n— "+gs.join("\n— ")):null, line("Почему / моя роль",dd.why)];
      break;
    case "writing":
      parts=[line("Минут",dd.minutes?String(dd.minutes):null), dd.text];
      break;
    case "affirm":
      parts=[dd.text];
      break;
    case "woop":
      parts=[line("Желание",dd.wish), line("Результат",dd.outcome), line("Препятствие",dd.obstacle), line("План",dd.plan)];
      break;
    case "bestself":
      parts=[line("Горизонт",dd.horizon), dd.text];
      break;
    case "money":
      parts=[line("Цель",dd.goal), line("Зачем",dd.whyGoal), line("Шаг недели",dd.step), line("Если-то",dd.ifthen)];
      break;
    case "values":
      var vl=(dd.vals||[]).slice(); if(dd.own) vl.push(dd.own);
      parts=[vl.length?("Ценности: "+vl.join(", ")):null, line("Главная",dd.mainValue), line("Поступок завтра",dd.action)];
      break;
    case "strengths":
      parts=[(dd.strengths&&dd.strengths.length)?("Сильные стороны: "+dd.strengths.join(", ")):null, line("Новое применение",dd.use)];
      break;
    case "activation":
      parts=[line("Дело",dd.deed), line("Когда и где",dd.when), line("Первые 2 минуты",dd.first2)];
      break;
    case "evening":
      var wins=[dd.win1,dd.win2,dd.win3].filter(Boolean);
      parts=[wins.length?("Получилось:\n— "+wins.join("\n— ")):null, line("Наблюдение",dd.observe)];
      break;
  }
  return parts.filter(Boolean).join("\n");
}

/* ---------- тренажёр ---------- */
function startPractice(id){
  state.run={id:id, step:0, data:{}};
  setView("runner");
  renderRunner();
  window.scrollTo(0,0);
}
function renderRunner(){
  stopTimer();
  var r=state.run; if(!r) return;
  var ss=steps(r.id);
  el.runner_title.textContent=PRACTICE_BY_ID[r.id].title;
  el.runner_step.textContent="шаг "+(r.step+1)+" из "+ss.length;
  el.runner_body.textContent="";
  ss[r.step](el.runner_body);
  el.runner_back.textContent = r.step===0 ? "Отмена" : "Назад";
  el.runner_next.textContent = r.step===ss.length-1 ? "Сохранить" : "Далее";
  notice(el.runner_notice,"");
}
el.runner_back.addEventListener("click",function(){
  var r=state.run; if(!r) return;
  if(r.step===0){ state.run=null; setView("practices"); return; }
  r.step--; renderRunner();
});
el.runner_next.addEventListener("click",function(){
  var r=state.run; if(!r) return;
  var ss=steps(r.id);
  if(r.step<ss.length-1){ r.step++; renderRunner(); return; }
  var req=requiredField(r.id);
  if(req && !(r.data[req[0]]&&String(r.data[req[0]]).trim())){
    notice(el.runner_notice,req[1],"err"); return;
  }
  var text=composeText(r.id,r.data);
  if(!text.trim()){ notice(el.runner_notice,"Пустая запись — заполни хотя бы одно поле.","err"); return; }
  el.runner_next.disabled=true;
  var doc={ type:typeOf(r.id), text:text, mood:r.data.moodAfter||r.data.moodBefore||null, fields:r.data };
  saveEntry(doc,function(){
    el.runner_next.disabled=false;
    state.run=null; setView("journal");
    notice(el.db_notice,"Практика записана в дневник.","ok");
    setTimeout(function(){ if(el.db_notice.textContent==="Практика записана в дневник.") notice(el.db_notice,""); },3000);
    window.scrollTo(0,0);
  },function(msg){ el.runner_next.disabled=false; notice(el.runner_notice,msg,"err"); });
});

function render(){
  var old=el.feed.querySelectorAll(".daygroup");
  Array.prototype.forEach.call(old,function(n){n.remove();});
  el.empty_state.hidden = state.entries.length>0;

  var groups={}, order=[];
  state.entries.forEach(function(e){
    if(!groups[e.day]){groups[e.day]=[];order.push(e.day);}
    groups[e.day].push(e);
  });
  order.forEach(function(day){
    var g=document.createElement("section"); g.className="daygroup";
    var h=document.createElement("h2");
    var p=day.split("-"); h.textContent=fmtDay.format(new Date(+p[0],+p[1]-1,+p[2]));
    g.appendChild(h);
    var list=document.createElement("div"); list.className="entries";
    groups[day].forEach(function(e){
      var card=document.createElement("article"); card.className="entry";
      var ic=document.createElement("span"); ic.className="eicon";
      ic.innerHTML=ICON_BY_TYPE[e.type]||ICONS.free;
      card.appendChild(ic);
      var body=document.createElement("div"); body.className="ebody";
      var top=document.createElement("div"); top.className="entry-top";
      var tag=document.createElement("span"); tag.className="tag";
      tag.textContent=TYPE_LABELS[e.type]||TYPE_LABELS.free; top.appendChild(tag);
      var tm=document.createElement("span"); tm.textContent=fmtTime.format(new Date(e.ts)); top.appendChild(tm);
      if(e.mood&&MOOD_BY_ID[e.mood]){ var md=document.createElement("span"); md.textContent=MOOD_BY_ID[e.mood].label; top.appendChild(md); }
      var del=document.createElement("button"); del.className="del"; del.type="button";
      del.textContent = state.armedDel===e.id ? "Удалить?" : "удалить";
      if(state.armedDel===e.id) del.classList.add("arm");
      del.addEventListener("click",function(){ onDelete(e.id); });
      top.appendChild(del);
      body.appendChild(top);
      var txt=document.createElement("div"); txt.className="entry-text"; txt.textContent=e.text;
      body.appendChild(txt);
      card.appendChild(body);
      list.appendChild(card);
    });
    g.appendChild(list); el.feed.appendChild(g);
  });
  renderStreak();
}
function renderStreak(){
  var days={}; state.entries.forEach(function(e){days[e.day]=true;});
  var n=0, cur=new Date();
  if(!days[localDay(cur)]) cur.setDate(cur.getDate()-1);
  while(days[localDay(cur)]){ n++; cur.setDate(cur.getDate()-1); }
  el.streak.hidden=n<2; el.streak.textContent="✦ дней подряд: "+n;
}
function onDelete(id){
  if(state.armedDel!==id){ state.armedDel=id; render(); return; }
  state.armedDel=null;
  if(state.db) state.db.collection("entries").doc(id).delete().catch(function(){});
  render();
}

var CHUNK=3500;
function hasCloud(){
  try{ return !!(TG && TG.CloudStorage && parseFloat(TG.version)>=6.9); }catch(e){ return false; }
}
var cloud = hasCloud() ? TG.CloudStorage : null;

function csCall(fn){
  var args=Array.prototype.slice.call(arguments,1);
  return new Promise(function(res,rej){
    args.push(function(err,val){ if(err) rej(err); else res(val); });
    try{ fn.apply(cloud,args); }catch(e){ rej(e); }
  });
}

/* резерв для обычного браузера (тест без Telegram) */
var LSKEY="tg_entries_v1";
function lsAll(){ try{ return JSON.parse(localStorage.getItem(LSKEY)||"{}"); }catch(e){ return {}; } }
function lsWrite(m){ try{ localStorage.setItem(LSKEY,JSON.stringify(m)); }catch(e){} }

function storeSave(id,obj){
  if(!cloud){ var m=lsAll(); m[id]=obj; lsWrite(m); return Promise.resolve(); }
  var json=JSON.stringify(obj), parts=[];
  for(var i=0;i<json.length;i+=CHUNK) parts.push(json.slice(i,i+CHUNK));
  var p=Promise.resolve();
  parts.forEach(function(part,idx){
    p=p.then(function(){ return csCall(cloud.setItem, id+"_"+idx, part); });
  });
  return p;
}
function storeDelete(id){
  if(!cloud){ var m=lsAll(); delete m[id]; lsWrite(m); return Promise.resolve(); }
  return csCall(cloud.getKeys).then(function(keys){
    var mine=(keys||[]).filter(function(k){ return k.indexOf(id+"_")===0; });
    return mine.length ? csCall(cloud.removeItems, mine) : null;
  });
}
function storeLoad(){
  if(!cloud){
    var m=lsAll();
    return Promise.resolve(Object.keys(m).map(function(id){ var o=m[id]; o.id=id; return o; }));
  }
  return csCall(cloud.getKeys).then(function(keys){
    keys=(keys||[]).filter(function(k){ return /^e\d/.test(k) && k.lastIndexOf("_")>0; });
    if(!keys.length) return [];
    var out={}, batches=[], p=Promise.resolve();
    for(var i=0;i<keys.length;i+=50) batches.push(keys.slice(i,i+50));
    batches.forEach(function(bk){
      p=p.then(function(){ return csCall(cloud.getItems,bk).then(function(vals){
        bk.forEach(function(k){ out[k]=vals?vals[k]:null; });
      }); });
    });
    return p.then(function(){
      var byId={};
      Object.keys(out).forEach(function(k){
        var dot=k.lastIndexOf("_"); var id=k.slice(0,dot), idx=+k.slice(dot+1);
        (byId[id]=byId[id]||[])[idx]=out[k];
      });
      return Object.keys(byId).map(function(id){
        try{ var o=JSON.parse(byId[id].join("")); o.id=id; return o; }catch(e){ return null; }
      }).filter(Boolean);
    });
  });
}

function refresh(){
  storeLoad().then(function(items){
    items.sort(function(a,b){ return a.ts<b.ts?1:-1; });
    state.entries=items.map(function(b){
      return { id:b.id, type:b.type||"free", text:String(b.text||""), mood:b.mood||null,
               ts:b.ts||new Date().toISOString(), day:b.day||String(b.ts||"").slice(0,10) };
    });
    render();
  }).catch(function(){
    notice(el.db_notice,"Не удалось загрузить записи из облака. Закрой и открой мини-приложение заново.","err");
  });
}

/* прослойка с тем же интерфейсом, что была у базы */
state.db={
  collection:function(){ return {
    doc:function(id){ return {
      set:function(data){
        try{ if(TG && TG.HapticFeedback) TG.HapticFeedback.notificationOccurred("success"); }catch(e){}
        return storeSave(id,data).then(refresh);
      },
      delete:function(){ return storeDelete(id).then(refresh); }
    };}
  };}
};
if(!cloud){
  notice(el.db_notice, TG
    ? "Старая версия Telegram: обнови приложение, чтобы включить облачное сохранение."
    : "Режим браузера: записи хранятся только на этом устройстве. Открой через Telegram для облака.","err");
}
refresh();

/* экспорт записей для разбора с Claude */
var expBtn=document.getElementById("export-btn");
if(expBtn) expBtn.addEventListener("click",function(){
  if(!state.entries.length){ notice(el.db_notice,"Пока нечего экспортировать — записей нет.","err"); return; }
  var json=JSON.stringify(state.entries,null,1);
  function ok(){ notice(el.db_notice,"Скопировано ("+state.entries.length+" записей) — вставь в чат с Claude для разбора.","ok"); }
  function manual(){
    var t=document.createElement("textarea"); t.value=json;
    t.style.position="fixed"; t.style.left="8px"; t.style.top="8px"; t.style.opacity="0.01";
    document.body.appendChild(t); t.focus(); t.select();
    var done=false;
    try{ done=document.execCommand("copy"); }catch(e){}
    document.body.removeChild(t);
    if(done) ok(); else notice(el.db_notice,"Копирование не разрешено — выдели записи ниже и скопируй вручную.","err");
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(ok,manual);
  } else manual();
});
})();
</script>
